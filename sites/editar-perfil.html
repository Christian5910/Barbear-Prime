<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Barbear Prime | Editar Perfil</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1A1613">
<link rel="apple-touch-icon" href="../assets/img/icon-192.png">
<link rel="icon" href="../assets/img/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../assets/css/style.css">
<script>!function(){var t=sessionStorage.getItem("bp-tema"),e=sessionStorage.getItem("bp-escala-fonte");t&&document.documentElement.setAttribute("data-tema",t);e&&document.documentElement.style.setProperty("--escala-fonte",e);}();</script>
</head>
<body data-pagina-atual="perfil">

<div class="app-shell">
  <div class="toast-prime" id="toastPrime"></div>

  <div class="header-marca">
    <a href="perfil.html" class="voltar-btn" aria-label="Voltar para o perfil"><i class="bi bi-arrow-left"></i></a>
    <h1 class="titulo-marca">Editar Perfil</h1>

    <nav class="nav-desktop" aria-label="Navegação principal">
      <a href="../index.html" class="nav-link-desktop"><i class="bi bi-house-door"></i> Início</a>
      <a href="servicos.html" class="nav-link-desktop"><i class="bi bi-calendar3"></i> Serviços</a>
      <a href="localizacao.html" class="nav-link-desktop"><i class="bi bi-geo-alt"></i> Localização</a>
      <a href="perfil.html" class="nav-link-desktop ativo" aria-current="page"><i class="bi bi-person"></i> Perfil</a>
    </nav>
    <button class="btn-hamburguer-mobile" id="btnHamburguer" aria-label="Abrir menu" aria-expanded="false" aria-controls="menuHamburguerPainel">
      <i class="bi bi-list"></i>
    </button>
  </div>

  <div class="menu-hamburguer-painel" id="menuHamburguerPainel">
    <div class="menu-hamburguer-conteudo">
      <a href="../index.html"><i class="bi bi-house-door"></i> Início</a>
      <a href="servicos.html"><i class="bi bi-calendar3"></i> Serviços</a>
      <a href="localizacao.html"><i class="bi bi-geo-alt"></i> Localização</a>
      <a href="preferencias-app.html"><i class="bi bi-gear"></i> Ajustes</a>
    </div>
  </div>

  <div class="tela-conteudo">
    <div class="scroll-y flex-grow-1 container-site pt-4 text-center" style="max-width:520px;">
      <div class="position-relative d-inline-block mb-3">
        <img class="avatar-circular img-carregando" id="editarAvatarPreview" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Pré-visualização da foto de perfil" style="width:110px;height:110px;" data-fallback-src="../assets/img/avatar-exemplo.jpg">
        <button class="btn btn-dark btn-sm rounded-circle position-absolute bottom-0 end-0" id="btnTrocarAvatar" aria-label="Trocar foto de perfil" style="width:38px;height:38px;">
          <i class="bi bi-camera-fill"></i>
        </button>
        <input type="file" id="inputAvatar" accept="image/png,image/jpeg,image/webp,image/gif" class="d-none" aria-label="Selecionar nova foto de perfil">
      </div>
      <p class="small texto-suave mb-3">Alterar Nome</p>

      <form class="text-start" id="formEditarPerfil" novalidate>
        <div class="mb-3">
          <label for="editarNome" class="form-label small fw-semibold">Nome completo</label>
          <input type="text" class="input-prime" id="editarNome" placeholder="Seu nome" maxlength="80">
        </div>
        <div class="mb-3">
          <label for="editarEmail" class="form-label small fw-semibold">E-mail</label>
          <input type="email" class="input-prime" id="editarEmail" placeholder="voce@email.com" maxlength="190">
        </div>
        <div class="mb-3 d-none" id="grupoSenhaAtual">
          <label for="editarSenhaAtual" class="form-label small fw-semibold">Senha atual</label>
          <input type="password" class="input-prime" id="editarSenhaAtual" placeholder="Necessária para trocar e-mail ou senha" autocomplete="current-password" maxlength="128">
          <p class="small texto-suave mt-1 mb-0">Pedimos a senha atual para proteger a sua conta caso alguém use o seu aparelho.</p>
        </div>
        <div class="mb-3">
          <label for="editarSenha" class="form-label small fw-semibold">Nova senha</label>
          <input type="password" class="input-prime" id="editarSenha" placeholder="Senha ***" autocomplete="new-password">
        </div>
        <div class="mb-3">
          <label for="editarConfirmarSenha" class="form-label small fw-semibold">Confirmar nova senha</label>
          <input type="password" class="input-prime" id="editarConfirmarSenha" placeholder="Confirmar Senha **" autocomplete="new-password">
        </div>
        <button type="submit" class="btn-prime w-100 d-block text-center">Salvar dados <i class="bi bi-check-lg ms-1"></i></button>
      </form>
    </div>
  </div>

  <div class="rodape-fixo">
    <nav class="nav-inferior" aria-label="Navegação inferior">
      <a href="../index.html" class="nav-item" data-nav="inicio"><i class="bi bi-house-door"></i><span>Início</span></a>
      <a href="meus-agendamentos.html" class="nav-item" data-nav="agenda"><i class="bi bi-calendar3"></i><span>Agenda</span></a>
      <a href="perfil.html" class="nav-item" data-nav="perfil"><i class="bi bi-person"></i><span>Perfil</span></a>
      <a href="preferencias-app.html" class="nav-item" data-nav="config"><i class="bi bi-gear"></i><span>Ajustes</span></a>
    </nav>
    <footer class="rodape-site">© <span data-ano-rodape>2026</span> Barbear Prime. Todos os direitos reservados.</footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="../database/db.js" defer></script>
<script src="../assets/src/ui.js" defer></script>
</body>
</html>
