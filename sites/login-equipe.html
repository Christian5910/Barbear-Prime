<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Barbear Prime | Acesso da Equipe</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1A1613">
<link rel="apple-touch-icon" href="../assets/img/icon-192.png">
<link rel="icon" href="../assets/img/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../assets/css/style.css">
<script>!function(){var t=sessionStorage.getItem("bp-tema"),e=sessionStorage.getItem("bp-escala-fonte");t&&document.documentElement.setAttribute("data-tema",t);e&&document.documentElement.style.setProperty("--escala-fonte",e);}();</script>
</head>
<body data-pagina-atual="perfil">

<div class="app-shell">
  <div class="toast-prime" id="toastPrime"></div>

  <div class="header-marca">
    <a href="login.html" class="voltar-btn" aria-label="Voltar para login do cliente">
      <i class="bi bi-arrow-left"></i>
    </a>
    <img class="selo-barbear" src="../assets/img/logo-header.png" alt="Emblema da Barbear Prime" style="object-fit:cover;">
    <h1 class="titulo-marca">Acesso Equipe</h1>
    <button class="btn-hamburguer-mobile" id="btnHamburguer" aria-label="Abrir menu" aria-expanded="false" aria-controls="menuHamburguerPainel">
      <i class="bi bi-list"></i>
    </button>
  </div>

  <div class="menu-hamburguer-painel" id="menuHamburguerPainel">
    <div class="menu-hamburguer-conteudo">
      <a href="../index.html"><i class="bi bi-house-door"></i> Início</a>
      <a href="servicos.html"><i class="bi bi-calendar3"></i> Serviços</a>
      <a href="localizacao.html"><i class="bi bi-geo-alt"></i> Localização</a>
      <a href="preferencias-app.html"><i class="bi bi-gear"></i> Ajustes</a>
    </div>
  </div>

  <div class="tela-conteudo" style="display:flex;flex-direction:column;flex:1;">
    <div class="auth-desktop-wrap scroll-y" style="flex:1;display:flex;align-items:center;justify-content:center;">
      <div class="auth-card-desktop text-center">
        <div class="selo-barbear mx-auto mb-3" style="width:64px;height:64px;font-size:1.7rem;">
          <img src="../assets/img/logo-header.png" alt="Emblema da Barbear Prime">
        </div>
        <h1 class="fonte-display fs-4 mb-1">Barbear Prime</h1>
        <p class="texto-suave small mb-4">Acesso da equipe</p>

        <form class="text-start" id="formLoginEquipe" novalidate>
          <div class="mb-3">
            <label for="equipeUsuario" class="form-label small fw-semibold">Usuário</label>
            <input type="email" class="input-prime" id="equipeUsuario" placeholder="Digite seu usuário" autocomplete="username" required>
            <div class="invalid-feedback">Informe um e-mail válido.</div>
          </div>
          <div class="mb-3">
            <label for="equipeSenha" class="form-label small fw-semibold">Senha</label>
            <input type="password" class="input-prime" id="equipeSenha" placeholder="Digite sua senha" autocomplete="current-password" required>
            <div class="invalid-feedback">Informe sua senha.</div>
          </div>
          <button type="submit" class="btn-prime w-100 d-block text-center">Entrar</button>
          <a href="esqueci-senha.html" class="btn btn-link w-100 text-decoration-none texto-suave small mt-2">Esqueci minha senha</a>
        </form>

        <p class="small mt-3 mb-0">Não tenho uma conta?
          <a href="login.html" class="fw-semibold texto-dourado">Acessar como cliente</a>
        </p>
        <p class="small mt-1">
          <a href="login.html" class="texto-suave text-decoration-none small">Voltar para login do cliente</a>
        </p>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../database/db.js" defer></script>
<script src="../assets/src/ui.js" defer></script>
</body>
</html>
