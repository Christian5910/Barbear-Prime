[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # As functions usam fetch/FormData/Blob nativos do Node (upload.js, ao
  # enviar arquivos pro ImageKit) — precisa do Node 18 ou mais novo.
  NODE_VERSION = "20"

# Todas as chamadas de API do front-end usam o prefixo /api/... — este
# redirect faz o Netlify rotear para a function certa por trás dos panos,
# sem o front-end precisar saber o nome real do arquivo da function.
[[redirects]]
  from = "/api/auth/:action"
  to = "/.netlify/functions/auth-:action"
  status = 200

[[redirects]]
  from = "/api/servicos"
  to = "/.netlify/functions/servicos"
  status = 200

# IMPORTANTE: redirects de :id abaixo usam splat de CAMINHO
# (".../funcao/:splat"), não mais placeholder virando query string
# (".../funcao?id=:id"). O segundo formato se mostrou pouco confiável em
# produção — o Netlify às vezes não preenchia o parâmetro, e a function
# recebia a chamada sem ID nenhum. Cada function envolvida lê o ID via
# `idDaRequisicao()` (_lib/http.js), que aceita tanto esse splat de
# caminho quanto uma query string manual — ver o comentário lá.
[[redirects]]
  from = "/api/servicos/*"
  to = "/.netlify/functions/servicos/:splat"
  status = 200

[[redirects]]
  from = "/api/barbeiros"
  to = "/.netlify/functions/barbeiros"
  status = 200

[[redirects]]
  from = "/api/usuarios/*"
  to = "/.netlify/functions/usuarios/:splat"
  status = 200

[[redirects]]
  from = "/api/agendamentos"
  to = "/.netlify/functions/agendamentos"
  status = 200

[[redirects]]
  from = "/api/agendamentos/*"
  to = "/.netlify/functions/agendamentos/:splat"
  status = 200

[[redirects]]
  from = "/api/horarios-disponiveis"
  to = "/.netlify/functions/horarios-disponiveis"
  status = 200

[[redirects]]
  from = "/api/preferencias-corte/*"
  to = "/.netlify/functions/preferencias-corte/:splat"
  status = 200

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config"
  status = 200

[[redirects]]
  from = "/api/notificacoes/*"
  to = "/.netlify/functions/notificacoes/:splat"
  status = 200

[[redirects]]
  from = "/api/upload"
  to = "/.netlify/functions/upload"
  status = 200

[[redirects]]
  from = "/api/bloqueios-agenda"
  to = "/.netlify/functions/bloqueios-agenda"
  status = 200

[[redirects]]
  from = "/api/equipe"
  to = "/.netlify/functions/equipe"
  status = 200

[[redirects]]
  from = "/api/equipe/*"
  to = "/.netlify/functions/equipe/:splat"
  status = 200

# ==============================================================================
# CABEÇALHOS DE SEGURANÇA (valem para o site inteiro)
# ==============================================================================
# Content-Security-Policy: o navegador só executa/carrega o que estiver nesta
# lista. Mesmo que algum dia entre um texto malicioso na página (XSS), ele
# não consegue rodar script de fora, mandar dados para outro servidor nem
# embutir o site em outro (clickjacking).
#   script-src   só arquivos do próprio site, o Bootstrap (jsDelivr) e o único
#                script inline das páginas (aplica tema/fonte antes de
#                desenhar; identificado pelo hash sha256, não por
#                'unsafe-inline'). Se você editar esse script, o hash muda e
#                precisa ser recalculado (ver DEPLOY.md, seção de segurança).
#   style-src    permite estilo inline porque as telas usam style="..." e o
#                Bootstrap ajusta estilos por JavaScript.
#   img-src      o próprio site, data:/blob: (prévia e recorte de imagem) e o
#                ImageKit (fotos enviadas).
#   connect-src  a API do próprio site, o ViaCEP (busca de endereço por CEP)
#                e TODO domínio externo de onde o site carrega algum arquivo
#                — veja o aviso abaixo, é mais amplo do que parece à primeira vista.
#   frame-src    o mapa do Google na página de Localização.
#
# ATENÇÃO — pegadinha do connect-src com Service Worker: o sw.js intercepta
# QUALQUER requisição GET que não seja /api/... (função iniciada em
# "self.addEventListener('fetch', ...)") para poder cachear e servir offline.
# Para isso, ele mesmo chama fetch(request) por dentro. O navegador aplica
# connect-src a QUALQUER fetch() feito por código JavaScript — inclusive
# esse, dentro do Service Worker — mesmo quando o recurso pedido originalmente
# era um <link rel="stylesheet">, uma fonte de @font-face ou uma <img>, que
# em circunstância normal (sem Service Worker) seriam avaliados por
# style-src/font-src/img-src, não por connect-src. Na prática isso quer dizer
# que TODO domínio de onde o site carrega algo (Bootstrap, Google Fonts,
# ImageKit) precisa estar em connect-src também, ou o Service Worker faz o
# navegador bloquear o próprio carregamento — foi exatamente isso que quebrou
# o visual do site (Bootstrap, ícones e fontes pararam de carregar).
# Se um dia trocar de provedor de imagem/fonte ou adicionar outro serviço
# externo (script, CSS, imagem, fonte — qualquer coisa que passa por um GET),
# inclua o endereço dele tanto na diretiva "certa" (script-src/style-src/...)
# quanto em connect-src, senão o navegador vai bloquear pelo Service Worker.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'sha256-x3iAZkBi31h9Iz2DRpgEWLRTWxho7vbpoUmn5mwye3s='; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https://ik.imagekit.io; media-src 'self' blob: data: https://ik.imagekit.io; connect-src 'self' https://viacep.com.br https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com https://ik.imagekit.io; frame-src https://www.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"

# Respostas da API nunca devem ficar guardadas em cache (têm dados de conta).
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
